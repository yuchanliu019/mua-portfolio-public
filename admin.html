<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品集管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbf7f8;color:#30232a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 96px}.pink{color:#c77f98;font-size:12px;font-weight:700;letter-spacing:.12em}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:23px;margin:5px 0}.card{background:#fff;border:1px solid #eddee2;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 14px #66263b0b}.card h2{font-size:16px;margin:0 0 12px}.small{font-size:12px;color:#a07583}.tabs{display:flex;gap:7px;margin:14px 0}.tabs button{flex:1;border:0;padding:11px;border-radius:11px;background:#f1e6e9;color:#87596a;font:inherit}.tabs button.on{background:#30232a;color:#fff}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select{width:100%;border:1px solid #ecdce1;border-radius:10px;padding:12px;font:inherit;background:#fff}.row{display:flex;gap:8px}.row>*{flex:1}.soft{border:0;background:#faedf1;color:#9c5b70;border-radius:10px;padding:10px;white-space:nowrap;font:inherit}.primary{width:100%;border:0;background:#30232a;color:#fff;border-radius:11px;padding:14px;font-weight:700;font:inherit}.upload{border:1.5px dashed #d7aebb;border-radius:12px;padding:17px;text-align:center;display:block}.upload input{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f3e8eb}.tile img{width:100%;height:100%;object-fit:cover}.tile button{position:absolute;right:4px;top:4px;background:#fff;border:0;border-radius:50%;width:25px;height:25px}.group{border:1px solid #ecdce1;border-radius:11px;margin:9px 0;overflow:hidden}.groupHead{padding:10px;background:#fff9fa;font-size:14px;font-weight:650;display:flex;gap:8px;align-items:center}.choice{display:flex;gap:9px;padding:9px;border-top:1px solid #f4e9ec;align-items:center}.choice img{width:46px;height:46px;object-fit:cover;border-radius:7px}.choice span{font-size:12px;color:#997780}.bar{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #eddee2;padding:12px 16px;backdrop-filter:blur(8px)}.bar>div{max-width:688px;margin:auto}.notice{font-size:13px;color:#9b6778;padding:10px;background:#fff4f6;border-radius:9px;margin:9px 0}.hidden{display:none}.msg{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#30232a;color:#fff;padding:10px 14px;border-radius:99px;font-size:13px;display:none;z-index:9;white-space:nowrap}
</style><body><div class="msg" id="msg"></div><div id="app"></div><script>
const OWNER='yuchanliu019',REPO='mua-portfolio-public',BRANCH='main',SITE='https://'+OWNER+'.github.io/'+REPO+'/';
let token=sessionStorage.getItem('mua_gh')||'',gallery={name:'',groups:[],items:[]},chosen=new Set(),tab='upload';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function say(s){let m=$('#msg');m.textContent=s;m.style.display='block';setTimeout(()=>m.style.display='none',2400)}
async function gh(path,opt={}){let r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{...opt,headers:{Authorization:'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'GitHub 操作失败');return d}
async function raw(path){let d;try{d=await gh(path)}catch(e){if(String(e).includes('404'))return null;throw e}let b=(d.content||'').replace(/\n/g,'');return new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)))}
function boot(){if(!token)return login();load()}
function login(){app.innerHTML='<main class="wrap"><div class="pink">MUA PORTFOLIO</div><h1>作品集管理</h1><section class="card"><h2>管理者登录</h2><p class="small">粘贴你的 GitHub 受限 Token（仅授权本作品集仓库）。它只保存在你当前浏览器的会话中，关闭后自动清除。</p><input id="key" type="password" placeholder="github_pat_..."><button class="primary" onclick="enter()">进入管理后台</button></section></main>'}
async function enter(){token=$('#key').value.trim();try{await gh('README.md');sessionStorage.setItem('mua_gh',token);load()}catch(e){token='';say('Token 无效或权限不足')}}
async function load(){try{let t=await raw('data/gallery.json');gallery=t?JSON.parse(t):{name:'',groups:[],items:[]};render()}catch(e){say('加载失败：'+e.message)}}
async function saveGallery(){let old=null;try{old=await gh('data/gallery.json')}catch(e){}let body={message:'更新图库',content:btoa(unescape(encodeURIComponent(JSON.stringify(gallery)))),branch:BRANCH};if(old&&old.sha)body.sha=old.sha;await gh('data/gallery.json',{method:'PUT',body:JSON.stringify(body)})}
function render(){app.innerHTML='<main class="wrap"><div class="top"><div><div class="pink">MUA PORTFOLIO</div><h1>作品集管理</h1></div><button class="soft" onclick="saveName()">保存名字</button></div><section class="card"><label>化妆师名字（分享标题：xxx化妆师作品集）</label><input id="name" value="'+esc(gallery.name)+'" placeholder="例如：小美"></section><div class="tabs"><button class="'+(tab==='upload'?'on':'')+'" onclick="tab=\'upload\';render()">上传图片</button><button class="'+(tab==='choose'?'on':'')+'" onclick="tab=\'choose\';render()">勾选生成</button></div><div id="body"></div></main><div class="bar"><div><button class="primary" onclick="freeze()">确认生成预览</button></div></div>';$('#body').innerHTML=tab==='upload'?uploadView():chooseView()}
function uploadView(){let works=gallery.items.filter(x=>x.section==='works'),about=gallery.items.filter(x=>x.section==='about');return '<section class="card"><h2>上传图片</h2><label>上传到</label><select id="section" onchange="groupBox()"><option value="works">作品展示</option><option value="about">个人介绍</option></select><div id="groupBox"><label>作品分组</label><select id="group"><option value="">选择已建分组</option>'+gallery.groups.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select><div class="row" style="margin-top:8px"><input id="newGroup" placeholder="新分组名，例如：新娘跟妆"><button class="soft" onclick="addGroup()">建立分组</button></div><div class="small" style="margin-top:8px">先建立分组，再上传图片；可同时存在多个分组。</div></div><label class="upload" for="files">＋ 选择图片上传（可多选）<input id="files" type="file" accept="image/*" multiple onchange="upload()"></label></section><section class="card"><h2>图库</h2><div class="small">上传的图片会一直保留，可重复用于不同冻结版本。</div><h3>作品展示</h3>'+grid(works)+'<h3>个人介绍</h3>'+grid(about)+'</section>'}
function grid(a){return a.length?'<div class="grid">'+a.map(x=>'<div class="tile"><img src="'+x.url+'"><button onclick="del(\''+x.id+'\')">×</button></div>').join('')+'</div>':'<p class="small">还没有图片</p>'}
function groupBox(){$('#groupBox').classList.toggle('hidden',$('#section').value==='about')}
async function addGroup(){let name=$('#newGroup').value.trim();if(!name)return say('请输入分组名');if(!gallery.groups.includes(name))gallery.groups.push(name);await saveGallery();render();$('#group').value=name;say('分组已建立')}
function imageBase64(buf){let bytes=new Uint8Array(buf),chunk=0x8000,parts=[];for(let i=0;i<bytes.length;i+=chunk)parts.push(String.fromCharCode(...bytes.subarray(i,i+chunk)));return btoa(parts.join(''))}async function upload(){let fs=[...$('#files').files],section=$('#section').value,group=section==='works'?$('#group').value:'';if(section==='works'&&!group)return say('请先建立并选择分组');try{for(let i=0;i<fs.length;i++){say('正在上传 '+(i+1)+'/'+fs.length+' …');let buf=await fs[i].arrayBuffer(),b64=imageBase64(buf),ext=(fs[i].name.split('.').pop()||'jpg').toLowerCase(),iid=crypto.randomUUID();await gh('data/images/'+iid+'.'+ext,{method:'PUT',body:JSON.stringify({message:'上传图片',content:b64,branch:BRANCH})});gallery.items.push({id:iid,section,group,url:SITE+'data/images/'+iid+'.'+ext})}await saveGallery();render();say('上传完成')}catch(e){say('上传失败：'+e.message)}}
async function del(i){if(!confirm('删除图片？已冻结版本不受影响。'))return;gallery.items=gallery.items.filter(x=>x.id!==i);await saveGallery();render()}
function chooseView(){let ws=gallery.items.filter(x=>x.section==='works'),ab=gallery.items.filter(x=>x.section==='about'),m={};ws.forEach(x=>(m[x.group]??=[]).push(x));return '<section class="card"><h2>勾选此次导出的内容</h2><div class="notice">生成后内容冻结；之后上传、删除或新导出都不会影响已生成的链接。</div><h3>作品展示</h3>'+Object.entries(m).map(([g,a])=>'<div class="group"><div class="groupHead"><input type="checkbox" '+(a.every(x=>chosen.has(x.id))?'checked':'')+' onchange="groupChoose('+JSON.stringify(a.map(x=>x.id)).replace(/"/g,'&quot;')+',this.checked)">'+esc(g)+' <span>（'+a.length+'张，整组勾选）</span></div>'+a.map(x=>choice(x)).join('')+'</div>').join('')+'<h3>个人介绍</h3>'+ab.map(x=>choice(x)).join('')+'</section>'}
function choice(x){return '<div class="choice"><input type="checkbox" '+(chosen.has(x.id)?'checked':'')+' onchange="choose(\''+x.id+'\',this.checked)"><img src="'+x.url+'"><span>'+esc(x.group||'个人介绍')+'</span></div>'}
function choose(i,on){on?chosen.add(i):chosen.delete(i);render()}
function groupChoose(a,on){a.forEach(i=>on?chosen.add(i):chosen.delete(i));render()}
async function saveName(){gallery.name=$('#name').value.trim();await saveGallery();say('名字已保存')}
async function freeze(){await saveName();if(!chosen.size)return say('请至少勾选一张图片');let items=gallery.items.filter(x=>chosen.has(x.id)),sid=crypto.randomUUID().slice(0,8);await gh('data/snapshots/'+sid+'.json',{method:'PUT',body:JSON.stringify({message:'生成冻结版本',content:btoa(unescape(encodeURIComponent(JSON.stringify({title:gallery.name,items:items})))),branch:BRANCH})});await new Promise(r=>setTimeout(r,4000));location.href=SITE+'?v='+sid}
boot();
</script></body></html>
